# pyproject.toml

[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "es-normalizer-py"
version = "0.2.4"
description = "Contact data normalization adapted from the Empreinte Sociométrique's normalizers, the Python port of es-normalizer"
readme = "README.md"
authors = [{ name = "Cyril Dever", email = "cdever@pep-s.com" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords = [
    "data",
    "contact",
    "normalization",
    "empreinte sociometrique",
]
dependencies = []
requires-python = ">=3.10.2"

[project.urls]
Homepage = "https://github.com/cyrildever/es-normalizer-py"
